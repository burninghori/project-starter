# 마이그레이션 파일 이름은 4자리 순번이다: alembic revision --rev-id 0001 -m "..." (규칙은 backend-conventions skill)
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s
# 접속 정보는 app.config.settings 가 준다(migrations/env.py)
sqlalchemy.url =

[loggers]
keys = root,alembic

[logger_root]
level = WARN
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handlers]
keys = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatters]
keys = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
