# PR 마다(그리고 main 에 들어간 뒤) 로컬 `make verify` 와 같은 검사를 돌린다.
# 검사 목록의 정본은 루트 Makefile 의 verify-backend · verify-frontend · verify-scripts 와 verify skill 이다 — 바꾸면 여기도 함께 바꾼다.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# 같은 브랜치에 새 커밋이 오면 앞 실행을 멈춘다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (ruff · pyright · pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # 로컬과 같은 `make local-up`(infra/local/docker-compose.yml) — Postgres 와 S3 호환 스토리지(SeaweedFS)가
      # 로컬과 같은 이미지·계정·버킷·포트로 뜨고, 테스트는 backend/.env.test 로 여기에 붙는다.
      # integration 테스트를 건너뛰지 않는다 — 컨테이너가 없으면 접속 오류로 실패한다.
      - name: 로컬 컨테이너 기동(Postgres · S3 호환 스토리지 · 버킷 생성)
        working-directory: .
        run: make local-up

      # Python 버전은 backend/.python-version, 의존성은 backend/uv.lock 이 정한다
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: 의존성 설치(lock 그대로)
        run: uv sync --frozen

      - name: ruff format
        run: uv run ruff format --check .

      - name: ruff check
        run: uv run ruff check .

      - name: pyright
        run: uv run pyright

      - name: pytest (unit + integration)
        run: uv run pytest

      - name: 컨테이너 로그(실패 때 원인 확인용)
        if: failure()
        working-directory: .
        run: docker compose -f infra/local/docker-compose.yml logs --no-color --tail 100

  scripts:
    name: scripts (shellcheck · shfmt)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # shellcheck 는 러너 이미지에 있고 shfmt 는 Ubuntu 패키지로 받는다. 검사 대상 · 옵션은 루트 Makefile 의 verify-scripts 가 정한다
      - name: shfmt 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shfmt

      - name: make verify-scripts
        run: make verify-scripts

  frontend:
    name: frontend (npm run verify)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치(lock 그대로)
        run: npm ci

      # format:check → typecheck → lint → lint:styles → test → build
      - name: npm run verify
        run: npm run verify
