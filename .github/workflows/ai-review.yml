# PR 이 열리면 Claude Code 가 pre-pr-review skill 기준으로 리뷰 코멘트를 남긴다(collaboration.md 7절).
#
# - 자동 실행은 PR 당 한 번(opened · ready_for_review). 커밋을 더 올려도(synchronize) 돌지 않는다.
#   다시 받으려면 PR 에 `/review` 코멘트(저장소 쓰기 권한자만).
# - 코드 경로가 바뀐 PR 만 자동 실행한다(paths). 문서만 바뀐 PR 은 `/review` 로만 돈다.
# - 라벨 `skip-ai-review` 가 있으면 자동·수동 모두 돌지 않는다.
# - 토큰은 저장소 시크릿 CLAUDE_CODE_OAUTH_TOKEN 하나다(collaboration.md 7절). 시크릿이 없으면 잡이 오류로 실패한다.
# - 리뷰 기준의 정본은 .claude/skills/pre-pr-review/SKILL.md 다. 이 파일의 프롬프트는 게시 방법만 정한다.
# - 액션은 리뷰가 실패해도 잡을 초록으로 끝내므로, 마지막 스텝이 실행 기록을 읽어 미완료를 실패로 바꾼다.
# - 이 파일을 바꾸는 PR 에서는 액션이 실행을 건너뛴다(PR 의 워크플로가 main 의 것과 같아야 한다는 액션의 안전장치) —
#   그 PR 에서는 이 잡이 붉게 보이고, 머지 뒤 다음 PR 부터 동작한다. 바꿀 때는 머지 뒤 `/review` 로 확인한다.
name: AI Review

on:
  pull_request:
    types: [opened, ready_for_review]
    paths:
      - "backend/**"
      - "frontend/**"
      - "!frontend/docs/**"
      - "infra/**"
      - ".github/**"
      - ".claude/**"
      - "Makefile"
      - "CLAUDE.md"
  issue_comment:
    types: [created]

# 같은 PR 의 실행이 겹칠 때: pull_request 실행끼리는 앞 것을 멈추고(초안 해제 등 재트리거), 코멘트 실행은 멈추지 않는다.
# 리뷰가 추적 코멘트를 달면 그것이 issue_comment 이벤트로 이 워크플로를 한 번 더 깨우는데(잡은 /review 가 아니라
# 건너뜀), 취소를 켜 두면 그 빈 실행이 진행 중인 /review 리뷰를 취소한다. 빈 실행은 큐에서 바로 빠진다.
concurrency:
  group: ai-review-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  review:
    if: >-
      (github.event_name == 'pull_request'
        && !github.event.pull_request.draft
        && !contains(github.event.pull_request.labels.*.name, 'skip-ai-review'))
      || (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.body == '/review'
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
        && !contains(github.event.issue.labels.*.name, 'skip-ai-review'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 시크릿이 없으면 액션이 인증 오류로 애매하게 끝난다. 그 전에 이유를 적고 실패한다(기조 5)
      - name: 토큰 시크릿 확인
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          [ -n "$TOKEN" ] || { echo "::error::저장소 시크릿 CLAUDE_CODE_OAUTH_TOKEN 이 없다 — 등록 방법은 collaboration.md 7절"; exit 1; }

      - name: Claude Code 리뷰
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 추적 코멘트 하나가 이 실행의 리뷰 산출물이자 기록이다. 코멘트 게시 도구(github_comment · github_inline_comment)도
          # 이 모드에서만 준비된다.
          track_progress: true
          # 세션이 결과 없이 끝났을 때 무엇을 하다 멈췄는지 잡 로그에서 볼 수 있게 한다
          show_full_output: true
          prompt: |
            PR #${{ github.event.pull_request.number || github.event.issue.number }} 를 리뷰한다.

            기준: 저장소의 `.claude/skills/pre-pr-review/SKILL.md` 가 정본이다. 먼저 그 파일과 `CLAUDE.md` 를 읽고,
            「범위 잡기」·「체크리스트」·「문서 변경의 경계」·「보고 형식」을 그대로 따른다.
            대상은 `gh pr diff` 의 변경과 바뀐 파일 전체다(diff 만 보지 않는다).

            게시 규칙(반드시 준수):
            - 줄 단위 지적은 `mcp__github_inline_comment__create_inline_comment` 로 단다. 단, 이 PR 의 diff 에 있는
              경로·줄에만 단다 — diff 밖은 GitHub 이 거부해 지적이 사라진다. diff 밖 지적은 요약의 별도 절에 적는다.
            - diff 안의 코드 지적(차단·권장·참고)은 요약에만 쓰지 말고 **반드시 인라인으로도** 단다. 「AI 리뷰: 코드만」인
              PR 에서도 코드 지적은 인라인이다 — 요약만 남기면 GitHub 의 Reviewers 에 리뷰가 보이지 않는다.
            - 요약은 이 실행의 추적 코멘트를 `mcp__github_comment__update_claude_comment` 로 갱신해 남긴다.
              `gh pr comment` 로 새 코멘트를 만들지 않는다.
            - 세션의 마지막 행동은 추적 코멘트 마감이다: 작업 목록을 전부 완료로 바꾸고 진행 중 표시를 지우고,
              심각도별 지적 수와 요약(지적이 없으면 「지적 없음」과 본 것)을 본문에 쓴다.
            - 이 실행에는 답할 사람이 없다. 질문·제안·중간 보고로 턴을 끝내지 않는다. 진행 메모는 다음 도구 호출과
              같은 메시지에 싣고 바로 이어서 진행한다.
            - 모든 글은 한국어로 쓴다. 코드·식별자·경로·명령은 원문 그대로 둔다.
          # 읽기 도구와 코멘트 게시만 허용한다. 리뷰가 코드를 고치지 않는다(pr-reviewer 에이전트와 같은 제한).
          # 모델은 Opus 5.5 — PR 당 한 번만 돌아 사용량 부담이 작고, 구조·경계 조건 지적의 깊이가 리뷰의 가치다
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git blame:*)"

      # 액션의 run 스텝은 세션이 오류로 끝나도 exit 0 한다. 실행 기록(execution_file)의 마지막 result 를 읽어
      # 오류·즉시 종료를 실패로 바꾼다. 앞 스텝이 실패했어도(cancelled 가 아니면) 돌려 사유를 로그에 남긴다.
      - name: 리뷰가 끝났는지 판정
        if: ${{ !cancelled() }}
        env:
          EXEC_FILE: ${{ steps.review.outputs.execution_file }}
        run: python3 .github/scripts/check_ai_review.py "$EXEC_FILE"
